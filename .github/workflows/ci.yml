name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Banco descartável só para os testes de integração.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desafio
          POSTGRES_PASSWORD: desafio
          POSTGRES_DB: checkin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafio -d checkin_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Testes unitários
        run: npm test
      - name: Testes e2e e de integração com PostgreSQL
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://desafio:desafio@localhost:5432/checkin_test

  web:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose (sobe tudo e testa de ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sobe o projeto como quem vai avaliar (espera o healthcheck da API)
        run: docker compose up --build -d --wait
      - name: Check-in, duplicado, CPF inexistente e fila
        run: |
          set -e
          criar() {
            curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/checkins \
              -H 'Content-Type: application/json' -d "{\"cpf\":\"$1\"}"
          }
          test "$(criar 111.111.111-11)" = 201
          test "$(criar 22222222222)" = 201
          test "$(criar 11111111111)" = 409
          test "$(criar 00000000000)" = 404
          curl -s http://localhost:3000/checkins | tee fila.json
          grep -q '"senha":2' fila.json
          grep -q '"cpfMascarado":"\*\*\*.111.111-\*\*"' fila.json
          if grep -q '11111111111' fila.json; then echo 'CPF completo na fila'; exit 1; fi
      - name: Chamada da próxima senha e painel sem dados pessoais
        run: |
          set -e
          curl -sf -X POST http://localhost:3000/checkins/chamar-proximo | grep -q '"senha":1'
          curl -s http://localhost:3000/chamadas | tee chamadas.json
          grep -q '"senha":1' chamadas.json
          if grep -qE 'nome|cpf' chamadas.json; then echo 'dado pessoal no painel'; exit 1; fi
      - name: Front responde nas quatro telas
        run: |
          for rota in / /totem /recepcao /painel; do
            curl -sf "http://localhost:5173$rota" | grep -q '<div id="root">'
          done
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
