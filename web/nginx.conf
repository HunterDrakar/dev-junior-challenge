server {
  listen 80;
  root /usr/share/nginx/html;

  # Arquivos com hash no nome: podem ficar em cache; se não existirem, 404.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rotas do React (/totem, /recepcao, /painel) caem no index.html, que não fica
  # em cache: totem e painel ligados o dia todo pegam a versão nova após um deploy.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
