# Sobe tudo com: docker compose up --build
#   web (React)        http://localhost:5173
#   api (NestJS)       http://localhost:3000
#   mock-service       http://localhost:4000
#   db (PostgreSQL)    só na rede interna do compose (a api acessa como db:5432)

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    # Sem "ports": o banco não precisa ser acessado de fora, e assim não conflita
    # com um PostgreSQL que já esteja rodando na máquina.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d checkin"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    # Se a API cair (ex.: o banco ficou fora do ar por um instante), o Docker a sobe de novo.
    restart: unless-stopped
    environment:
      # Dentro da rede do compose os serviços se chamam pelo nome.
      CADASTRO_URL: http://mock-service:4000
      DATABASE_URL: postgres://desafio:desafio@db:5432/checkin
    ports:
      - "3000:3000"
    depends_on:
      mock-service:
        condition: service_started
      db:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
